line-length = 100
target-version = "py311"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line-length handled by formatter
]
exclude = [".venv", ".aws-sam", "__pycache__"]

[format]
quote-style = "double"
indent-style = "space"
